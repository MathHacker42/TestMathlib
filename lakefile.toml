name = "TestMathlib"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TestMathlib"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.16.0"

[[lean_lib]]
name = "TestMathlib"
